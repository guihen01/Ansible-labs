- name: Enable nginx repo
  command: amazon-linux-extras enable nginx1

- name: Install nginx
  yum:
    name: nginx
    state: present

- name: Deploy web page
  template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
  notify: restart nginx

- name: Start nginx
  service:
    name: nginx
    state: started
    enabled: true
